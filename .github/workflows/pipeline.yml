name: build_and_test 
on:
  push:
    # trigger on tags with a semvar tag format (a release tag)
    tags: 
      - "v*.*.*"
  pull_request:
    branches:
      - "main" 

jobs:
  test:
    runs-on: ubuntu-latest
    container: 
      image: registry.access.redhat.com/ubi9/ubi:9.4
    strategy: 
      matrix: 
        python-version: ["3.10"]
    steps: 
      - uses: actions/checkout@v4
      - name: Install uv managed python and set up environment 
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --all-extras --dev 
      - name: Lint code 
        run: uv ruff check --fix src/
      - name: Run tests
        run: uv run pytest
