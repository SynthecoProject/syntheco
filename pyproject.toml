[project]
name = "syntheco"
version = "0.1.0"
authors = [ 
    { name = "Syntheco Project" },
]
requires-python = ">=3.10"
description = "A Python framework for creating synthetic ecosystems."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "geopandas==0.11.1",
    "ipfn==1.4.4",
    "matplotlib==3.5.2",
    "numpy==1.22.4",
    "pandas==1.4.2",
    "pluggy==1.0.0",
    "pytest==7.1.2",
    "pyyaml==6.0",
    "requests>=2.32.4",
    "requests-cache>=1.2.1",
    "responses>=0.25.7",
    "schema==0.7.5",
    "shapely==1.8.2",
    "urllib3==1.26.5",
]
dev = [
    "ruff",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syntheco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
markers = "apitest: tests that check for expected output from the Census API"
addopts = "-m 'not apitest'"

[tool.ruff]
line-length = 120

[project.scripts]
syntheco = "syntheco:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/SynthecoProject/syntheco"
